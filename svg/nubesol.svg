<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(135,206,250)" />
      <stop offset="100%" style="stop-color:rgb(176,224,230)" />
    </linearGradient>

    <keyframe-animation id="sun-pulse">
      <animate attributeName="r" from="50" to="55" dur="1s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="fill" from="#FFD700" to="#FFC125" dur="1s" begin="0s" repeatCount="indefinite" />
    </keyframe-animation>

    <keyframe-animation id="cloud-move">
      <animate attributeName="transform" type="translate" from="0,0" to="10,0" dur="5s" begin="0s" repeatCount="indefinite" />
    </keyframe-animation>

    <keyframe-animation id="ray-spin">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </keyframe-animation>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGradient)" />

  <g transform="translate(450, 100)">
    <circle cx="0" cy="0" r="50" fill="#FFD700">
      <animate attributeName="r" values="50;55;50" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#FFD700;#FFC125;#FFD700" dur="2s" repeatCount="indefinite" />
    </circle>
    <g id="rays">
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(45)">
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(90)">
        <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(135)">
        <animateTransform attributeName="transform" type="rotate" from="135" to="495" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(180)">
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(225)">
        <animateTransform attributeName="transform" type="rotate" from="225" to="585" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(270)">
        <animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="10s" repeatCount="indefinite" />
      </path>
      <path d="M 0,-70 L 5,-55 L 0,-60 L -5,-55 Z" fill="#FFD700" transform="rotate(315)">
        <animateTransform attributeName="transform" type="rotate" from="315" to="675" dur="10s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <g id="clouds" transform="translate(0, 0)">
    <g transform="translate(100, 150) scale(0.8)">
      <path d="M 0,0 C 20,-30 80,-30 100,0 C 120,20 120,80 100,100 C 80,120 20,120 0,100 C -20,80 -20,20 0,0 Z" fill="#FFB6C1" stroke="#E06C75" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="10 0" dur="3s" repeatCount="indefinite" />
      </path>
    </g>
    <g transform="translate(300, 200) scale(1.2)">
      <path d="M 0,0 C 20,-30 80,-30 100,0 C 120,20 120,80 100,100 C 80,120 20,120 0,100 C -20,80 -20,20 0,0 Z" fill="#ADD8E6" stroke="#4682B4" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-10 0" dur="4s" repeatCount="indefinite" />
      </path>
    </g>
    <g transform="translate(50, 280) scale(0.9)">
      <path d="M 0,0 C 20,-30 80,-30 100,0 C 120,20 120,80 100,100 C 80,120 20,120 0,100 C -20,80 -20,20 0,0 Z" fill="#90EE90" stroke="#2E8B57" stroke-width="2">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="5 0" dur="2.5s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>