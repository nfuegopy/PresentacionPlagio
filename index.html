    <style>
      body {
        font-family: "Fredoka", sans-serif;
        background: linear-gradient(to bottom, #87ceeb, #e0f7fa);
        color: #333;
        /* overflow: hidden; quitado de aquí para evitar problemas de renderizado */
      }

      .background-elements {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0; /* Capa de fondo definitiva */
        overflow: hidden; /* Evita el scroll por las animaciones */
      }

      .cloud {
        position: absolute;
        opacity: 0.9;
        border-radius: 50%;
        filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.2));
        animation: flotar 40s linear infinite;
      }
      .cloud:before,
      .cloud:after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }
      .cloud.large {
        width: 180px;
        height: 60px;
        animation-duration: 70s;
      }
      .cloud.medium {
        width: 150px;
        height: 50px;
        animation-duration: 60s;
      }
      .cloud.small {
        width: 120px;
        height: 40px;
        animation-duration: 50s;
      }
      .cloud.pink {
        background: #ff9ee0;
      }
      .cloud.pink:before,
      .cloud.pink:after {
        background: #ff9ee0;
      }
      .cloud.blue {
        background: #89cff0;
      }
      .cloud.blue:before,
      .cloud.blue:after {
        background: #89cff0;
      }
      .cloud.green {
        background: #9ee09e;
      }
      .cloud.green:before,
      .cloud.green:after {
        background: #9ee09e;
      }
      .cloud.purple {
        background: #cc99ff;
      }
      .cloud.purple:before,
      .cloud.purple:after {
        background: #cc99ff;
      }
      .cloud.large:before {
        width: 70px;
        height: 70px;
        top: -30px;
        left: 20px;
      }
      .cloud.large:after {
        width: 90px;
        height: 90px;
        top: -40px;
        left: 60px;
      }
      .cloud.medium:before {
        width: 60px;
        height: 60px;
        top: -25px;
        left: 15px;
      }
      .cloud.medium:after {
        width: 80px;
        height: 80px;
        top: -35px;
        left: 50px;
      }
      .cloud.small:before {
        width: 50px;
        height: 50px;
        top: -20px;
        left: 10px;
      }
      .cloud.small:after {
        width: 70px;
        height: 70px;
        top: -30px;
        left: 35px;
      }
      .sol {
        position: absolute;
        width: 120px;
        height: 120px;
        background: #ffde59;
        border-radius: 50%;
        box-shadow: 0 0 50px #ffde59, 0 0 100px #ffde59;
        animation: girar 30s linear infinite,
          brillar 2.5s ease-in-out infinite alternate;
      }
      .rayo {
        position: absolute;
        background: #ffde59;
        width: 10px;
        height: 50px;
        border-radius: 5px;
        top: 50%;
        left: 50%;
        margin-top: -25px;
        margin-left: -5px;
        transform-origin: center 25px;
      }
      .rayo:nth-child(1) {
        transform: rotate(0deg) translateY(-80px);
      }
      .rayo:nth-child(2) {
        transform: rotate(45deg) translateY(-80px);
      }
      .rayo:nth-child(3) {
        transform: rotate(90deg) translateY(-80px);
      }
      .rayo:nth-child(4) {
        transform: rotate(135deg) translateY(-80px);
      }
      .rayo:nth-child(5) {
        transform: rotate(180deg) translateY(-80px);
      }
      .rayo:nth-child(6) {
        transform: rotate(225deg) translateY(-80px);
      }
      .rayo:nth-child(7) {
        transform: rotate(270deg) translateY(-80px);
      }
      .rayo:nth-child(8) {
        transform: rotate(315deg) translateY(-80px);
      }
      @keyframes flotar {
        0%,
        100% {
          transform: translateY(0) translateX(0) rotate(0deg);
        }
        25% {
          transform: translateY(-25px) translateX(20px) rotate(-2deg);
        }
        50% {
          transform: translateY(10px) translateX(40px) rotate(1deg);
        }
        75% {
          transform: translateY(-15px) translateX(20px) rotate(2deg);
        }
      }
      @keyframes flotar2 {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(1);
        }
        50% {
          transform: translateY(-30px) translateX(25px) scale(1.05);
        }
      }
      @keyframes girar {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes brillar {
        from {
          box-shadow: 0 0 50px #ffde59, 0 0 100px #ffde59;
          transform: scale(1);
        }
        to {
          box-shadow: 0 0 80px #ffd700, 0 0 130px #ffd700;
          transform: scale(1.1);
        }
      }

      .main-content {
        position: relative;
        z-index: 10; /* Capa de contenido principal */
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .presentation-container {
        background-color: #ffffff;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        position: relative;
        /* NUEVO BORDE FESTIVO */
        border-width: 12px;
        border-style: solid;
        border-image-slice: 1;
        border-image-source: linear-gradient(
          45deg,
          #f08080,
          #ffb6c1,
          #add8e6,
          #87cefa,
          #98fb98
        );
      }

      /* NUEVO LAZO DE REGALO */
      .presentation-container::before,
      .presentation-container::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 55px;
        background: #f08080;
        border: 2px solid #fff;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        z-index: 12;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      .presentation-container::before {
        top: -30px;
        left: 25px;
        transform: rotate(-45deg);
      }
      .presentation-container::after {
        top: -30px;
        left: 50px;
        transform: rotate(45deg);
      }

      .slide {
        display: none;
        min-height: 85vh;
        opacity: 0;
        transition: opacity 0.7s ease-in-out;
        align-items: center;
        justify-content: center;
        padding: 2.5rem;
      }
      .slide.active {
        display: flex;
        opacity: 1;
      }
      .slide-content {
        max-width: 1100px;
        width: 100%;
      }
      img.slide-image {
        max-height: 400px;
        object-fit: contain;
        border-radius: 2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        border: 4px solid #b3e0ff;
        opacity: 0; /* Inicia invisible para la animación */
      }

      /* NUEVA ANIMACIÓN PARA IMÁGENES */
      @keyframes slideImageEnter {
        0% {
          opacity: 0;
          transform: scale(0.7) rotate(-5deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      .slide-image-animate {
        animation: slideImageEnter 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          0.2s forwards;
      }

      .bullet-list li {
        position: relative;
        padding-left: 35px;
        margin-bottom: 14px;
        text-align: left;
        font-size: 1.2rem;
        color: #444;
      }
      .bullet-list li::before {
        content: "⭐";
        position: absolute;
        left: 0;
        font-size: 1.5rem;
        line-height: 1;
      }
      .pediatric-title {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        background-image: linear-gradient(
          45deg,
          #ff8c94,
          #ffb6c1,
          #a1c4fd,
          #87ceeb
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
        line-height: 1.2;
      }
      h1 {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
      }
      .conclusion-box {
        background-color: #e0f7fa;
        border: 3px solid #90caf9;
        color: #1e3a8a;
        border-radius: 1.5rem;
        padding: 1.5rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

      #prevBtn,
      #nextBtn {
        transition: all 0.3s ease-in-out;
      }
      #prevBtn:hover:not(:disabled),
      #nextBtn:hover:not(:disabled) {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>

      function renderSlides() {
        let slideHTML = "";
        slidesData.forEach((slide, index) => {
          let layoutClass = "flex-col text-center";
          let contentOrder = "";
          let imageHTML = "";
          let textContainerClass =
            "w-full flex flex-col items-center justify-center";
          const titleClass = slide.customTitleClass
            ? slide.customTitleClass
            : "text-4xl";

          if (slide.imageUrl) {
            layoutClass = "md:flex-row gap-8";
            contentOrder = "md:order-first";
            imageHTML = `<div class="w-full md:w-5/12 flex items-center justify-center p-4"><img src="${slide.imageUrl}" alt="${slide.title}" class="slide-image"></div>`;
            textContainerClass = "w-full md:w-7/12";
          }

          if (slide.isMultiImage) {
            layoutClass = "flex-col";
            imageHTML = `<div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-4 p-4">
                        ${slide.imageUrls
                          .map(
                            (url) =>
                              `<div class="flex items-center justify-center"><img src="${url}" alt="${slide.title}" class="slide-image h-48 w-48 object-cover"></div>`
                          )
                          .join("")}
                    </div>`;
            textContainerClass = "w-full mt-6";
          }

          if (index === 0) {
            imageHTML = "";
            layoutClass = "flex-col text-center";
            textContainerClass =
              "w-full flex flex-col items-center justify-center";
          }

          if (slide.layout === "title" || slide.layout === "conclusion") {
            textContainerClass =
              "w-full flex flex-col items-center justify-center";
          }

          slideHTML += `
                    <div id="slide-${index}" class="slide ${layoutClass}">
                        ${imageHTML}
                        <div class="${textContainerClass} ${contentOrder}">
                            <h1 class="${titleClass} font-bold mb-6 ${
            slide.layout === "conclusion" ? "" : "pediatric-title"
          }">${slide.title}</h1>
                            <div class="w-full">${slide.content}</div>
                        </div>
                    </div>
                `;
        });
        container.innerHTML = slideHTML;
      }

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const slideCounter = document.getElementById("slideCounter");

      function showSlide(index) {
        const slides = document.querySelectorAll(".slide");

        // SCRIPT MODIFICADO PARA ANIMACIÓN DE IMAGEN
        const allImages = document.querySelectorAll(".slide-image");
        allImages.forEach((img) => {
          img.classList.remove("slide-image-animate");
          // truco para forzar el reinicio de la animación
          void img.offsetWidth;
        });

        slides.forEach((slide, i) => {
          if (i === index) {
            slide.classList.add("active");
            // Añade la clase de animación a las imágenes de la diapositiva activa
            const activeImages = slide.querySelectorAll(".slide-image");
            activeImages.forEach((img, imgIndex) => {
              img.style.animationDelay = `${imgIndex * 0.15}s`;
              img.classList.add("slide-image-animate");
            });
          } else {
            slide.classList.remove("active");
          }
        });
        slideCounter.textContent = `Diapositiva ${index + 1} de ${
          slides.length
        }`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
      }

      prevBtn.addEventListener("click", () => {
        if (currentSlide > 0) {
          currentSlide--;
          showSlide(currentSlide);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentSlide < slidesData.length - 1) {
          currentSlide++;
          showSlide(currentSlide);
        }
      });

      // Initial setup
      renderSlides();
      showSlide(currentSlide);
    </script>
  </body>
</html>
