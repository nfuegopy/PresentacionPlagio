<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impacto de las asimetrías craneales en Odontología Pediátrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Fredoka", sans-serif;
        background: linear-gradient(to bottom, #87ceeb, #e0f7fa);
        color: #333;
        /* overflow: hidden; quitado de aquí para evitar problemas de renderizado */
      }

      .background-elements {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0; /* Capa de fondo definitiva */
        overflow: hidden; /* Evita el scroll por las animaciones */
      }

      .cloud {
        position: absolute;
        opacity: 0.9;
        border-radius: 50%;
        filter: drop-shadow(2px 4px 3px rgba(0, 0, 0, 0.2));
        animation: flotar 40s linear infinite;
      }
      .cloud:before,
      .cloud:after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }
      .cloud.large {
        width: 180px;
        height: 60px;
        animation-duration: 70s;
      }
      .cloud.medium {
        width: 150px;
        height: 50px;
        animation-duration: 60s;
      }
      .cloud.small {
        width: 120px;
        height: 40px;
        animation-duration: 50s;
      }
      .cloud.pink {
        background: #ff9ee0;
      }
      .cloud.pink:before,
      .cloud.pink:after {
        background: #ff9ee0;
      }
      .cloud.blue {
        background: #89cff0;
      }
      .cloud.blue:before,
      .cloud.blue:after {
        background: #89cff0;
      }
      .cloud.green {
        background: #9ee09e;
      }
      .cloud.green:before,
      .cloud.green:after {
        background: #9ee09e;
      }
      .cloud.purple {
        background: #cc99ff;
      }
      .cloud.purple:before,
      .cloud.purple:after {
        background: #cc99ff;
      }
      .cloud.large:before {
        width: 70px;
        height: 70px;
        top: -30px;
        left: 20px;
      }
      .cloud.large:after {
        width: 90px;
        height: 90px;
        top: -40px;
        left: 60px;
      }
      .cloud.medium:before {
        width: 60px;
        height: 60px;
        top: -25px;
        left: 15px;
      }
      .cloud.medium:after {
        width: 80px;
        height: 80px;
        top: -35px;
        left: 50px;
      }
      .cloud.small:before {
        width: 50px;
        height: 50px;
        top: -20px;
        left: 10px;
      }
      .cloud.small:after {
        width: 70px;
        height: 70px;
        top: -30px;
        left: 35px;
      }
      .sol {
        position: absolute;
        width: 120px;
        height: 120px;
        background: #ffde59;
        border-radius: 50%;
        box-shadow: 0 0 50px #ffde59, 0 0 100px #ffde59;
        animation: girar 30s linear infinite,
          brillar 2.5s ease-in-out infinite alternate;
      }
      .rayo {
        position: absolute;
        background: #ffde59;
        width: 10px;
        height: 50px;
        border-radius: 5px;
        top: 50%;
        left: 50%;
        margin-top: -25px;
        margin-left: -5px;
        transform-origin: center 25px;
      }
      .rayo:nth-child(1) {
        transform: rotate(0deg) translateY(-80px);
      }
      .rayo:nth-child(2) {
        transform: rotate(45deg) translateY(-80px);
      }
      .rayo:nth-child(3) {
        transform: rotate(90deg) translateY(-80px);
      }
      .rayo:nth-child(4) {
        transform: rotate(135deg) translateY(-80px);
      }
      .rayo:nth-child(5) {
        transform: rotate(180deg) translateY(-80px);
      }
      .rayo:nth-child(6) {
        transform: rotate(225deg) translateY(-80px);
      }
      .rayo:nth-child(7) {
        transform: rotate(270deg) translateY(-80px);
      }
      .rayo:nth-child(8) {
        transform: rotate(315deg) translateY(-80px);
      }
      @keyframes flotar {
        0%,
        100% {
          transform: translateY(0) translateX(0) rotate(0deg);
        }
        25% {
          transform: translateY(-25px) translateX(20px) rotate(-2deg);
        }
        50% {
          transform: translateY(10px) translateX(40px) rotate(1deg);
        }
        75% {
          transform: translateY(-15px) translateX(20px) rotate(2deg);
        }
      }
      @keyframes flotar2 {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(1);
        }
        50% {
          transform: translateY(-30px) translateX(25px) scale(1.05);
        }
      }
      @keyframes girar {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes brillar {
        from {
          box-shadow: 0 0 50px #ffde59, 0 0 100px #ffde59;
          transform: scale(1);
        }
        to {
          box-shadow: 0 0 80px #ffd700, 0 0 130px #ffd700;
          transform: scale(1.1);
        }
      }

      .main-content {
        position: relative;
        z-index: 10; /* Capa de contenido principal */
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .presentation-container {
        background-color: #ffffff;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        position: relative;
        /* NUEVO BORDE FESTIVO */
        border-width: 12px;
        border-style: solid;
        border-image-slice: 1;
        border-image-source: linear-gradient(
          45deg,
          #f08080,
          #ffb6c1,
          #add8e6,
          #87cefa,
          #98fb98
        );
      }

      /* NUEVO LAZO DE REGALO */
      .presentation-container::before,
      .presentation-container::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 55px;
        background: #f08080;
        border: 2px solid #fff;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        z-index: 12;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      .presentation-container::before {
        top: -30px;
        left: 25px;
        transform: rotate(-45deg);
      }
      .presentation-container::after {
        top: -30px;
        left: 50px;
        transform: rotate(45deg);
      }

      .slide {
        display: none;
        min-height: 85vh;
        opacity: 0;
        transition: opacity 0.7s ease-in-out;
        align-items: center;
        justify-content: center;
        padding: 2.5rem;
      }
      .slide.active {
        display: flex;
        opacity: 1;
      }
      .slide-content {
        max-width: 1100px;
        width: 100%;
      }
      img.slide-image {
        max-height: 400px;
        object-fit: contain;
        border-radius: 2rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        border: 4px solid #b3e0ff;
        opacity: 0; /* Inicia invisible para la animación */
      }

      /* NUEVA ANIMACIÓN PARA IMÁGENES */
      @keyframes slideImageEnter {
        0% {
          opacity: 0;
          transform: scale(0.7) rotate(-5deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      .slide-image-animate {
        animation: slideImageEnter 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          0.2s forwards;
      }

      .bullet-list li {
        position: relative;
        padding-left: 35px;
        margin-bottom: 14px;
        text-align: left;
        font-size: 1.2rem;
        color: #444;
      }
      .bullet-list li::before {
        content: "⭐";
        position: absolute;
        left: 0;
        font-size: 1.5rem;
        line-height: 1;
      }
      .pediatric-title {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
        background-image: linear-gradient(
          45deg,
          #ff8c94,
          #ffb6c1,
          #a1c4fd,
          #87ceeb
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
        line-height: 1.2;
      }
      h1 {
        font-family: "Fredoka", sans-serif;
        font-weight: 700;
      }
      .conclusion-box {
        background-color: #e0f7fa;
        border: 3px solid #90caf9;
        color: #1e3a8a;
        border-radius: 1.5rem;
        padding: 1.5rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      #prevBtn,
      #nextBtn {
        transition: all 0.3s ease-in-out;
      }
      #prevBtn:hover:not(:disabled),
      #nextBtn:hover:not(:disabled) {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>

    <div class="main-content">

      <div class="mt-8 flex items-center justify-between w-full max-w-6xl">
        <button

          </svg>
        </button>
      </div>

    <script>
      const slidesData = [
        {
          // Diapositiva 1
          title: "¡Cuidando las cabecitas de nuestros peques!",
          content: `<p class="text-2xl mt-8 text-gray-600">Presenta: Od. Lusmela A. Melgarejo L.</p>`,

        {

        },
        {
          // Diapositiva 3
          title: "Plagiocefalia",
          imageUrl: "img/diapositiva 3.jpg",
          content: `<p class="text-2xl text-gray-700 text-left mb-4 leading-relaxed">Considerada la asimetría craneal más frecuente, se caracteriza por un aplanamiento asimétrico en uno de los lados del occipucio.</p>`,
        },
        {
          // Diapositiva 4
          title: "Braquicefalia",
          imageUrl: "img/diapositiva 4.png",
          content: `<p class="text-2xl text-gray-700 text-left mb-4 leading-relaxed">La cabeza se observa corta y ancha, esta deformidad puede ser simétrica cuando el aplanamiento occipital es bilateral, y asimétrica cuando se acentúa más de un lado.</p>`,
        },
        {
          // Diapositiva 5
          title: "Dolicocefalia",
          imageUrl: "img/diapositiva 5.png",
          content: `<p class="text-2xl text-gray-700 text-left mb-4 leading-relaxed">Se caracteriza por el alargamiento excesivo de la cabeza en sentido anteroposterior y un estrechamiento lateral, así mismo se observa la cara larga y estrecha.</p>`,
        },
        {
          // Diapositiva 6
          title: "Deformidades no posicionales: Craneosinostosis",
          imageUrl: "img/diapositiva 6.png",
          content: `<p class="text-2xl text-gray-700 text-left mb-4 leading-relaxed">Es el cierre prematuro de una o más suturas craneales lo que impide el crecimiento normal del cráneo, causando deformidades estructurales.</p>`,
        },
        {
          // Diapositiva 7
          title: "Ortesis craneal",
          isMultiImage: true,
          imageUrls: [
            "img/diapositiva 7a.jpg",
            "img/diapositiva 7b.jpg",
            "img/diapositiva 7c.jpg",
            "img/diapositiva 7d.jpg",
          ],
          content: `<p class="text-2xl text-gray-700 text-center mb-4 leading-relaxed">Es un dispositivo médico para la corrección de deformidades craneales. Sirve de guía para el crecimiento, aprovechando la plasticidad del cráneo del lactante desde los 4 meses de edad.</p>`,
        },
        {
          // Diapositiva 8
          title: "Consecuencias de asimetrías craneales no tratadas",
          layout: "title",
          content: `<p class="text-2xl text-gray-700 text-center">Vamos a explorar cómo estas condiciones impactan el sistema estomatognático (boca y cara).</p>`,
        },
        {
          // Diapositiva 9
          title: "Plagiocefalia: Desviación mandibular y asimetría facial",
          imageUrl: "img/diapositiva 9.png",
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">La desviación de la mandíbula puede causar una asimetría notoria en el rostro.</p>`,
        },
        {
          // Diapositiva 10
          title: "Plagiocefalia: Maloclusiones frecuentes",
          isMultiImage: true,
          imageUrls: [
            "img/diapositiva 10 a.jpg",
            "img/diapositiva 10 b.jpg",
            "img/diapositiva 10 c.jpg",
          ],
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">Estas asimetrías pueden llevar a problemas de mordida, donde los dientes no encajan correctamente.</p>`,
        },
        {
          // Diapositiva 11
          title: "Plagiocefalia: Alteraciones en la ATM",
          isMultiImage: true,
          imageUrls: [
            "img/diapositiva 11 a.png",
            "img/diapositiva 11 b.jpg",
            "img/diapositiva 11 c.jpg",
          ],
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">La articulación temporomandibular (ATM) puede sufrir, causando dolor, chasquidos y dificultad para mover la mandíbula.</p>`,

        {
          // Diapositiva 12
          title: "Plagiocefalia: Trastornos funcionales",
          isMultiImage: true,
          imageUrls: [
            "img/diapositiva 12 a.jpg",
            "img/diapositiva 12 b.jpg",

        {

        {

          title: "Braquicefalia: Retracción del maxilar superior",
          imageUrl: "img/diapositiva 14.jpg",
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">El maxilar superior puede no desarrollarse completamente, quedando retraído.</p>`,

        {

          isMultiImage: true,
          imageUrls: ["img/diapositiva 15.jpg", "img/diapositiva 10 a.jpg"],
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">Al igual que en la plagiocefalia, son comunes los problemas de mordida.</p>`,

        {

        {

        {
          // Diapositiva 19 (del docx)
          title: "Dolicocefalia: Paladar ojival",
          imageUrl: "img/diapositiva 19.jpg",
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">El paladar puede adoptar una forma alta y abovedada, similar a una ojiva.</p>`,

        {
          // Diapositiva 20 (del docx)
          title: "Dolicocefalia: Crecimiento facial vertical",

        {

          imageUrls: ["img/diapositiva 12 a.jpg", "img/diapositiva 12 b.jpg"],
          content: `<p class="text-2xl text-gray-700 text-center leading-relaxed">Son comunes la respiración oral, deglución atípica, masticación deficiente y alteraciones del habla.</p>`,

        {
          // Diapositiva 22
          title: "¿En qué momento pueden observarse?",
          content: `
                    <ul class="bullet-list text-2xl text-gray-700">
                      <li><strong>Plagiocefalia:</strong> Las consecuencias son visibles desde los 2–3 años y se acentúan durante la dentición mixta.</li>
                      <li><strong>Braquicefalia:</strong> Las alteraciones son detectables desde la infancia, con mayor complejidad ortodóncica en la adolescencia si no se trata.</li>

                    </ul>
                `,
        },
        {
          // Diapositiva 23
          title: "Conclusiones",
          layout: "conclusion",
          content: `
                    <div class="space-y-6">
                      <div class="conclusion-box"><p class="text-2xl">La plagiocefalia no tratada puede dejar asimetrías mandibulares persistentes, aunque la asimetría craneal mejore con el tiempo.</p></div>
                      <div class="conclusion-box"><p class="text-2xl">La intervención temprana mejora la asimetría y cambia el pronóstico, reduciendo la necesidad de tratamientos más complejos e invasivos.</p></div>
                      <div class="conclusion-box"><p class="text-2xl">La forma del cráneo no es solo estética; es la base de la función. Si no se tratan, la mandíbula y la oclusión pagan el costo.</p></div>
                    </div>
                `,

        {
          // Diapositiva 24
          title:
            "“La forma del cráneo moldea la función; detectar a tiempo puede cambiar el futuro de ese paciente”",
          layout: "title",
          content: `<p class="text-3xl mt-12 text-gray-600">Ante la sospecha, debemos desarrollar el ojo clínico y derivar al paciente con los especialistas en neurocirugía pediátrica. ¡Muchas gracias!</p>`,

      const container = document.getElementById("presentation-container");
      let currentSlide = 0;

      function renderSlides() {
        let slideHTML = "";
        slidesData.forEach((slide, index) => {
          let layoutClass = "flex-col text-center";
          let contentOrder = "";
          let imageHTML = "";
          let textContainerClass =
            "w-full flex flex-col items-center justify-center";
          const titleClass = slide.customTitleClass
            ? slide.customTitleClass
            : "text-4xl";

          if (slide.imageUrl) {
            layoutClass = "md:flex-row gap-8";
            contentOrder = "md:order-first";
            imageHTML = `<div class="w-full md:w-5/12 flex items-center justify-center p-4"><img src="${slide.imageUrl}" alt="${slide.title}" class="slide-image"></div>`;
            textContainerClass = "w-full md:w-7/12";
          }

          if (slide.isMultiImage) {
            layoutClass = "flex-col";
            imageHTML = `<div class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 mt-4 p-4">
                        ${slide.imageUrls
                          .map(
                            (url) =>
                              `<div class="flex items-center justify-center"><img src="${url}" alt="${slide.title}" class="slide-image h-48 w-auto object-contain"></div>`
                          )
                          .join("")}
                    </div>`;
            textContainerClass = "w-full mt-6";
          }

          if (index === 0) {
            imageHTML = "";
            layoutClass = "flex-col text-center";
            textContainerClass =
              "w-full flex flex-col items-center justify-center";
          }

          if (slide.layout === "title" || slide.layout === "conclusion") {
            layoutClass = "flex-col";
            imageHTML = "";
            textContainerClass =
              "w-full flex flex-col items-center justify-center";
          }

          slideHTML += `
                    <div id="slide-${index}" class="slide ${layoutClass}">
                        ${imageHTML}
                        <div class="${textContainerClass} ${contentOrder}">
                            <h1 class="${titleClass} font-bold mb-6 ${
            slide.layout === "conclusion" ? "" : "pediatric-title"
          }">${slide.title}</h1>
                            <div class="w-full">${slide.content}</div>
                        </div>
                    </div>
                `;
        });
        container.innerHTML = slideHTML;
      }

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const slideCounter = document.getElementById("slideCounter");

      function showSlide(index) {
        const slides = document.querySelectorAll(".slide");

        const allImages = document.querySelectorAll(".slide-image");
        allImages.forEach((img) => {
          img.classList.remove("slide-image-animate");
          void img.offsetWidth;
        });

        slides.forEach((slide, i) => {
          if (i === index) {
            slide.classList.add("active");
            const activeImages = slide.querySelectorAll(".slide-image");
            activeImages.forEach((img, imgIndex) => {
              img.style.animationDelay = `${imgIndex * 0.15}s`;
              img.classList.add("slide-image-animate");
            });
          } else {
            slide.classList.remove("active");
          }
        });
        slideCounter.textContent = `Diapositiva ${index + 1} de ${
          slides.length
        }`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
      }

      prevBtn.addEventListener("click", () => {
        if (currentSlide > 0) {
          currentSlide--;
          showSlide(currentSlide);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentSlide < slidesData.length - 1) {
          currentSlide++;
          showSlide(currentSlide);
        }
      });

      renderSlides();
      showSlide(currentSlide);
    </script>
  </body>
</html>
