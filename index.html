<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asimetrías Craneales y su Afectación Estomatognática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
      }
      .slide {
        display: none;
        min-height: 85vh;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .slide.active {
        display: flex;
        opacity: 1;
      }
      .slide-content {
        max-width: 1100px;
        width: 100%;
      }
      img.slide-image {
        max-height: 450px;
        object-fit: contain;
        border-radius: 1rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }
      .bullet-list li {
        position: relative;
        padding-left: 28px;
        margin-bottom: 12px;
        text-align: left;
      }
      .bullet-list li::before {
        content: "✓";
        position: absolute;
        left: 0;
        color: #3b82f6;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="flex flex-col items-center justify-center min-h-screen p-4">
    <div
      id="presentation-container"
      class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden"
    ></div>

    <div class="mt-6 flex items-center justify-between w-full max-w-6xl">
      <button
        id="prevBtn"
        class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 mr-2"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
            clip-rule="evenodd"
          />
        </svg>
        Anterior
      </button>
      <span
        id="slideCounter"
        class="text-gray-700 font-semibold text-lg"
      ></span>
      <button
        id="nextBtn"
        class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center"
      >
        Siguiente
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 ml-2"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <script>
      const slidesData = [
        {
          // Slide 1
          title:
            "Asimetrías Craneales y su afectación en el sistema estomatognático",
          layout: "title",
          content: `<p class="text-2xl mt-8 text-gray-500">Od. Lusmela Anahí Melgarejo López</p>`,
        },
        {
          // Slide 2
          title: "La base de todo",
          imageUrl: "01.png",
          content: `<p class="text-xl text-gray-700 text-left max-w-lg">La forma craneal es la base sobre la que se organizan la cara, la mandíbula y las funciones orales. La base craneal es el “piso” donde se apoya la mandíbula. Cualquier asimetría en ese piso obliga a la mandíbula a adaptarse, fijando alteraciones oclusales y musculares.</p>`,
        },
        {
          // Slide 3
          title: "Plagiocefalia",
          imageUrl: "02.png",
          content: `
                    <p class="text-xl text-gray-600 text-left mb-4">Es la asimetría más frecuente. El cráneo rota, desplazando el cóndilo y obligando a la mandíbula a desviarse.</p>
                    <ul class="bullet-list text-lg text-gray-700">
                      <li>Desviación mandibular visible.</li>
                      <li>Líneas medias dentarias no coincidentes.</li>
                      <li>Plano oclusal inclinado.</li>
                      <li>Mordida cruzada unilateral.</li>
                      <li>Carga desigual en la articulación temporomandibular (ATM).</li>
                    </ul>
                `,
        },
        {
          // Slide 4
          title: "Braquicefalia",
          imageUrl: "03.png",
          content: `
                    <p class="text-xl text-gray-600 text-left mb-4">Cráneo corto y ancho. Este patrón se asocia con frecuencia a:</p>
                    <ul class="bullet-list text-lg text-gray-700">
                      <li>Maloclusiones de Clase II.</li>
                      <li>Sobremordida aumentada.</li>
                      <li>Carga excesiva en la zona anterior (riesgo de desgastes).</li>
                      <li>Menor eficiencia masticatoria.</li>
                      <li>Tendencia a la respiración oral.</li>
                    </ul>
                `,
        },
        {
          // Slide 5
          title: "Dolicocefalia",
          imageUrl: "04.png",
          content: `
                    <p class="text-xl text-gray-600 text-left mb-4">Cráneo largo y estrecho. Se correlaciona con:</p>
                    <ul class="bullet-list text-lg text-gray-700">
                      <li>Maxilares estrechos (mordida cruzada bilateral).</li>
                      <li>Tendencia a maloclusiones de Clase III.</li>
                      <li>Mordida abierta.</li>
                      <li>Lengua baja e interposición lingual.</li>
                      <li>Respiración oral crónica y adaptaciones posturales.</li>
                    </ul>
                `,
        },
        {
          // Slide 6
          title: "Impacto Funcional",
          isMultiImage: true,
          imageUrls: ["05.png", "06.png", "08.png"],
          content: `
                    <p class="text-xl text-center text-gray-800 font-medium">No hablamos de estética, sino de funciones integradas que se ven afectadas:</p>
                    <div class="grid md:grid-cols-3 gap-4 mt-4 text-center">
                      <div><h3 class="font-bold text-blue-600">Masticación</h3><p class="text-gray-600">Unilateral, con sobrecarga muscular y articular.</p></div>
                      <div><h3 class="font-bold text-blue-600">Deglución</h3><p class="text-gray-600">Patrones atípicos con interposición lingual.</p></div>
                      <div><h3 class="font-bold text-blue-600">Respiración</h3><p class="text-gray-600">Comprometida, llevando a respiración oral crónica.</p></div>
                    </div>
                `,
        },
        {
          // Slide 7
          title: "Evidencia Científica",
          imageUrl: "09.png",
          content: `
                    <p class="text-xl text-gray-600 text-left mb-4">Diversos estudios demuestran que:</p>
                    <ul class="bullet-list text-lg text-gray-700">
                      <li>La plagiocefalia no tratada deja asimetrías mandibulares persistentes.</li>
                      <li>Existe una alta correlación entre braquicefalia y Clase II.</li>
                      <li>La dolicocefalia se relaciona con Clase III y mordida abierta.</li>
                      <li>La intervención temprana mejora la simetría y reduce la necesidad de tratamientos complejos.</li>
                    </ul>
                `,
        },
        {
          // Slide 8
          title: "Conclusiones Clave",
          layout: "conclusion",
          content: `
                    <div class="space-y-6">
                      <div class="p-4 bg-blue-50 rounded-lg shadow"><p class="text-xl text-blue-800">1. La forma del cráneo no es un detalle estético. <strong>Es la base de la función estomatognática.</strong></p></div>
                      <div class="p-4 bg-blue-50 rounded-lg shadow"><p class="text-xl text-blue-800">2. Si las asimetrías craneales no se tratan, <strong>la mandíbula y la oclusión pagan el costo.</strong></p></div>
                      <div class="p-4 bg-blue-50 rounded-lg shadow"><p class="text-xl text-blue-800">3. La detección y la intervención temprana <strong>cambian el pronóstico y evitan tratamientos invasivos.</strong></p></div>
                    </div>
                `,
        },
        {
          // Slide 9
          title: "Mensaje Final",
          content: `<p class="text-4xl font-bold text-center text-blue-800">“La forma del cráneo moldea la función. Detectar a tiempo cambia el futuro.”</p><p class="text-2xl mt-12 text-gray-600">Muchas gracias.</p>`,
        },
      ];

      const container = document.getElementById("presentation-container");
      let currentSlide = 0;

      function renderSlides() {
        let slideHTML = "";
        slidesData.forEach((slide, index) => {
          let layoutClass = "flex-col text-center";
          let contentOrder = "";
          let imageHTML = "";
          let textContainerClass =
            "w-full flex flex-col items-center justify-center";

          if (slide.imageUrl && !slide.isMultiImage) {
            layoutClass = "md:flex-row gap-8";
            contentOrder = "md:order-first";
            imageHTML = `<div class="w-full md:w-5/12 flex items-center justify-center p-4"><img src="${slide.imageUrl}" alt="${slide.title}" class="slide-image"></div>`;
            textContainerClass = "w-full md:w-7/12";
          }

          if (slide.isMultiImage) {
            layoutClass = "flex-col";
            imageHTML = `<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
                        ${slide.imageUrls
                          .map(
                            (url) =>
                              `<div class="flex items-center justify-center"><img src="${url}" alt="${slide.title}" class="slide-image h-48 w-48 object-cover"></div>`
                          )
                          .join("")}
                    </div>`;
            textContainerClass = "w-full mt-6";
          }

          if (slide.layout === "title" || slide.layout === "conclusion") {
            textContainerClass =
              "w-full flex flex-col items-center justify-center";
          }

          slideHTML += `
                    <div id="slide-${index}" class="slide ${layoutClass}">
                        ${imageHTML}
                        <div class="${textContainerClass} ${contentOrder}">
                            <h1 class="text-4xl font-bold text-gray-800 mb-6">${slide.title}</h1>
                            <div class="text-gray-700 w-full">${slide.content}</div>
                        </div>
                    </div>
                `;
        });
        container.innerHTML = slideHTML;
      }

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const slideCounter = document.getElementById("slideCounter");

      function showSlide(index) {
        const slides = document.querySelectorAll(".slide");
        slides.forEach((slide, i) => {
          if (i === index) {
            slide.classList.add("active");
          } else {
            slide.classList.remove("active");
          }
        });
        slideCounter.textContent = `Diapositiva ${index + 1} de ${
          slides.length
        }`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
      }

      prevBtn.addEventListener("click", () => {
        if (currentSlide > 0) {
          currentSlide--;
          showSlide(currentSlide);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentSlide < slidesData.length - 1) {
          currentSlide++;
          showSlide(currentSlide);
        }
      });

      // Initial setup
      renderSlides();
      showSlide(currentSlide);
    </script>
  </body>
</html>
